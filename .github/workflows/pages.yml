name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # This repo's Pages source is still "deploy from branch", and that
      # publish cannot be switched from here. Let it finish, then replace it
      # with an artifact that omits _src (Jekyll exclude does not apply while
      # .nojekyll is present).
      - name: Wait for the branch publish to finish
        run: sleep 90
      - name: Assemble site without generator sources
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a \
            --exclude '_src/' \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude '_config.yml' \
            ./ _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
